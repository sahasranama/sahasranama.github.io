<!DOCTYPE html>
<html lang="en" data-theme="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sahasranama Atlas - the thousand names of Vishnu, connected</title>
<meta name="description" content="An interactive atlas of the 1000 names of Vishnu. Wander the litany through shared roots, themes of life, avatars and recurring meanings.">
<link rel="stylesheet" href="css/atlas.css">
</head>
<body>

  <!-- LOADING -->
  <div id="loader">
    <div class="lom">ॐ</div>
    <div class="ltext">gathering the thousand names...</div>
    <div class="lbar"><i></i></div>
  </div>

  <!-- CANVAS STAGE -->
  <div id="stage">
    <canvas id="atlas-canvas"></canvas>
  </div>

  <!-- LITANY LENS -->
  <div class="litany" id="litany">
    <div class="litany-inner" id="litanyInner"></div>
  </div>

  <!-- TOP BAR -->
  <div class="topbar">
    <div class="brand">
      <span class="om">ॐ</span>
      <div class="titles">
        <h1>Sahasranama <em>Atlas</em></h1>
        <span class="sub">the thousand names, connected</span>
      </div>
    </div>
    <div class="spacer"></div>
    <div class="lens-switch" id="lensSwitch"></div>
    <button class="iconbtn" id="indexBtn" aria-label="Index"></button>
    <div class="search" id="search">
      <button class="iconbtn" id="searchBtn" aria-label="Search names"></button>
      <input id="searchInput" type="text" placeholder="search a name or meaning..." autocomplete="off" spellcheck="false">
      <div class="search-results" id="searchResults"></div>
    </div>
    <button class="iconbtn" id="musicBtn" aria-label="Play the chant"></button>
    <button class="iconbtn" id="tweakBtn" aria-label="Display tweaks"></button>
    <button class="iconbtn" id="themeBtn" aria-label="Toggle day / night"></button>
    <button class="iconbtn" id="aboutBtn" aria-label="About"></button>
  </div>

  <!-- TWEAKS POPOVER (vanilla) -->
  <div class="tweakpanel" id="tweakPanel" hidden></div>

  <!-- CHANT PLAYER (Spotify embed, lazy-loaded on first open) -->
  <div class="musicpanel" id="musicPanel" hidden>
    <div class="mp-head">Listen to the recitation</div>
    <div class="mp-embed" id="musicEmbed"></div>
    <div class="mp-note">Streamed from Spotify.</div>
  </div>

  <!-- LEFT RAIL -->
  <div class="rail" id="rail">
    <div class="panel">
      <h2>Connections</h2>
      <div class="conn" id="connList"></div>
    </div>
    <div class="panel">
      <h2>Filter by theme</h2>
      <div class="chips" id="themeChips"></div>
    </div>
    <div class="panel">
      <h2>Filter by avatar</h2>
      <div class="chips" id="avatarChips"></div>
    </div>
    <div class="rail-foot">
      <button class="reset" id="resetBtn"></button>
    </div>
  </div>

  <!-- INDEX PANEL (left slide-in, contextual to the active connection) -->
  <aside class="indexpanel" id="indexPanel">
    <div class="ix-head">
      <div class="ix-title">Index</div>
      <button class="iconbtn ix-close" id="indexClose" aria-label="Close index"></button>
    </div>
    <div class="ix-tabs" id="ixTabs"></div>
    <input id="indexSearch" class="ix-search" type="text" placeholder="filter the index..." autocomplete="off" spellcheck="false">
    <div class="ix-list" id="indexList"></div>
  </aside>

  <!-- HINT -->
  <div class="hint" id="hint">
    <span>click a name</span><span class="d"></span>
    <span>scroll to zoom</span><span class="d"></span>
    <span>drag to pan</span>
  </div>

  <!-- SCALE / COUNT -->
  <div class="scalebar" id="scalebar"></div>

  <!-- DETAIL PANEL -->
  <aside class="detail" id="detail">
    <button class="iconbtn dclose" id="detailClose" aria-label="Close"></button>
    <div class="dscroll" id="detailBody"></div>
  </aside>

  <!-- ABOUT -->
  <div class="about" id="about">
    <div class="about-card" id="aboutBody"></div>
    <button class="iconbtn" id="aboutClose" aria-label="Close about" style="position:absolute;top:24px;right:24px;"></button>
  </div>

  <script src="js/engine.js"></script>
  <script src="js/app.js"></script>
  <script src="js/tweaks.js"></script>
</body>
</html>
